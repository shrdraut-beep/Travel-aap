<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <linearGradient id="mountainGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="glassBadge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f8fafc" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="24" y="24" width="464" height="464" rx="102" fill="none" stroke="#f97316" stroke-width="4" stroke-opacity="0.6"/>

  <circle cx="256" cy="205" r="150" fill="none" stroke="#38bdf8" stroke-width="2" stroke-dasharray="8 6" opacity="0.35"/>
  <circle cx="256" cy="205" r="162" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.2"/>

  <circle cx="256" cy="160" r="72" fill="url(#goldGrad)"/>

  <polygon points="120,310 205,140 290,310" fill="url(#mountainGrad2)"/>
  <polygon points="205,140 230,185 205,198 180,185" fill="#ffffff" opacity="0.9"/>

  <polygon points="210,310 310,120 410,310" fill="url(#mountainGrad)"/>
  <polygon points="310,120 338,170 310,185 282,170" fill="#ffffff" opacity="0.95"/>

  <path d="M 256,310 Q 256,260 220,240 T 256,180" fill="none" stroke="url(#roadGrad)" stroke-width="22" stroke-linecap="round"/>
  <path d="M 256,310 Q 256,260 220,240 T 256,180" fill="none" stroke="#ffffff" stroke-width="3" stroke-dasharray="10 8"/>

  <path d="M 256,85 L 266,195 L 256,205 L 246,195 Z" fill="#ef4444"/>
  <path d="M 256,85 L 256,205 L 246,195 Z" fill="#b91c1c"/>
  <path d="M 256,325 L 266,215 L 256,205 L 246,215 Z" fill="#94a3b8"/>

  <g transform="translate(0, 10)">
    <rect x="42" y="365" width="428" height="95" rx="28" fill="url(#glassBadge)" stroke="#f97316" stroke-width="3" filter="url(#shadow)"/>
    <text x="256" y="412" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="30" fill="#0f172a" text-anchor="middle" letter-spacing="1">प्रवास वाटाघाटी</text>
    <text x="256" y="442" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="800" font-size="14" fill="#ea580c" text-anchor="middle" letter-spacing="2">PRAVAS WATAGHATI • TRAVEL PLANNER</text>
  </g>
