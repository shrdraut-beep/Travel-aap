<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0284c7" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- NO BACKGROUND RECTANGLE - Fully Transparent Background -->

  <g filter="url(#glow)">
    <!-- Outer Compass Ring Ring Dash -->
    <circle cx="256" cy="210" r="175" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="12 8" opacity="0.85"/>
    
    <!-- Sun -->
    <circle cx="256" cy="165" r="75" fill="url(#sunGrad)"/>

    <!-- Mountains Background -->
    <polygon points="110,300 200,150 290,300" fill="#1e293b"/>
    <polygon points="200,150 225,190 200,205 175,190" fill="#f8fafc"/>
    <polygon points="230,300 320,170 410,300" fill="#0f172a" opacity="0.9"/>
    <polygon points="320,170 340,205 320,218 300,205" fill="#e2e8f0"/>

    <!-- Pine Trees -->
    <polygon points="125,300 140,260 155,300" fill="#059669"/>
    <polygon points="130,270 140,240 150,270" fill="#10b981"/>

    <!-- Palm Tree Right -->
    <path d="M360,300 Q370,220 400,160" fill="none" stroke="#78350f" stroke-width="12" stroke-linecap="round"/>
    <path d="M400,160 Q350,130 320,145" fill="none" stroke="#15803d" stroke-width="8" stroke-linecap="round"/>
    <path d="M400,160 Q430,125 455,150" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round"/>
    <path d="M400,160 Q420,190 445,200" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round"/>

    <!-- Ocean Wave Curves -->
    <path d="M60,300 Q160,270 256,300 T452,300 L452,350 L60,350 Z" fill="#0284c7" opacity="0.85"/>
    <path d="M60,315 Q160,290 256,315 T452,315 L452,360 L60,360 Z" fill="#0369a1"/>

    <!-- Camper Van Centerpiece -->
    <g transform="translate(0, -15)">
      <!-- Main body -->
      <rect x="175" y="235" width="162" height="85" rx="22" fill="url(#vanGrad)" stroke="#ffffff" stroke-width="5"/>
      <!-- Roof Rack -->
      <rect x="195" y="227" width="122" height="9" rx="4" fill="#e2e8f0"/>
      <!-- Front & Side Windows -->
      <rect x="190" y="248" width="48" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
      <rect x="248" y="248" width="72" height="34" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2.5"/>
      <!-- Wheels -->
      <circle cx="212" cy="320" r="20" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
      <circle cx="212" cy="320" r="7" fill="#94a3b8"/>
      <circle cx="300" cy="320" r="20" fill="#0f172a" stroke="#ffffff" stroke-width="5"/>
      <circle cx="300" cy="320" r="7" fill="#94a3b8"/>
      <!-- Headlight -->
      <circle cx="332" cy="288" r="7" fill="#fef08a"/>
    </g>

    <!-- Marathi & English Branding Text (Transparent backdrop) -->
    <text x="256" y="425" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#0f172a" text-anchor="middle" letter-spacing="1">प्रवास वाटाघाटी</text>
    <text x="256" y="458" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#0284c7" text-anchor="middle" letter-spacing="2">Pravas Wataghati</text>
  </g>
</svg>
