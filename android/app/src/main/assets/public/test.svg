<svg xmlns='http://www.w3.org/2000/svg' width='512' height='512' viewBox='0 0 512 512'>
  <defs>
    <linearGradient id='bg' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#0f172a'/>
      <stop offset='100%' stop-color='#1e293b'/>
    </linearGradient>
    <linearGradient id='badge' x1='0%' y1='0%' x2='0%' y2='100%'>
      <stop offset='0%' stop-color='#38bdf8'/>
      <stop offset='100%' stop-color='#0284c7'/>
    </linearGradient>
    <linearGradient id='sun' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#fde047'/>
      <stop offset='100%' stop-color='#f97316'/>
    </linearGradient>
    <linearGradient id='van' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#06b6d4'/>
      <stop offset='100%' stop-color='#0e7490'/>
    </linearGradient>
  </defs>
  <rect width='512' height='512' rx='128' fill='url(#bg)'/>
  <circle cx='256' cy='256' r='210' fill='none' stroke='#38bdf8' stroke-width='8' stroke-dasharray='12 8' opacity='0.4'/>
  <!-- Sun -->
  <circle cx='256' cy='200' r='90' fill='url(#sun)'/>
  <!-- Mountain -->
  <polygon points='120,340 210,190 300,340' fill='#334155'/>
  <polygon points='210,190 235,230 210,245 185,230' fill='#f8fafc'/>
  <!-- Palm tree -->
  <path d='M340,340 Q350,260 380,210' fill='none' stroke='#78350f' stroke-width='12' stroke-linecap='round'/>
  <path d='M380,210 Q340,180 320,190 M380,210 Q410,180 430,200 M380,210 Q390,230 420,240' fill='none' stroke='#22c55e' stroke-width='8' stroke-linecap='round'/>
  <!-- Ocean Wave -->
  <path d='M80,340 Q160,310 240,340 T400,340 T432,340 L432,380 L80,380 Z' fill='#0284c7'/>
  <!-- Camper Van -->
  <rect x='190' y='270' width='130' height='70' rx='16' fill='url(#van)' stroke='#ffffff' stroke-width='4'/>
  <rect x='270' y='280' width='40' height='28' rx='6' fill='#e0f2fe'/>
  <circle cx='220' cy='340' r='14' fill='#0f172a' stroke='#ffffff' stroke-width='4'/>
  <circle cx='290' cy='340' r='14' fill='#0f172a' stroke='#ffffff' stroke-width='4'/>
  <!-- Text Badge -->
  <text x='256' y='430' font-family='sans-serif' font-weight='900' font-size='28' fill='#ffffff' text-anchor='middle' letter-spacing='2'>PRAVAS WATAGHATI</text>
  <text x='256' y='460' font-family='sans-serif' font-weight='700' font-size='16' fill='#38bdf8' text-anchor='middle' letter-spacing='1'>दोस्तांची सफर, हिशोब विसर</text>
