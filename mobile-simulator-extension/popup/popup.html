<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mobile Simulator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-content">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="5" y="2" width="14" height="20" rx="2" ry="2"/>
          <line x1="12" y1="18" x2="12" y2="18" stroke-linecap="round"/>
        </svg>
        <h1 class="header-title">Mobile Simulator</h1>
      </div>
      <p class="header-subtitle">Preview on any device</p>
    </header>

    <!-- Status Badge -->
    <div class="status-bar">
      <div class="status-indicator" id="statusIndicator">
        <span class="status-dot" id="statusDot"></span>
        <span class="status-text" id="statusText">Inactive</span>
      </div>
    </div>

    <!-- Device Selection -->
    <section class="card">
      <label class="card-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
          <line x1="8" y1="21" x2="16" y2="21"/>
          <line x1="12" y1="17" x2="12" y2="21"/>
        </svg>
        Device Preset
      </label>
      <select id="deviceSelect" class="select">
        <optgroup label="Apple">
          <option value="iphone-15-pro">iPhone 15 Pro</option>
          <option value="iphone-15-pro-max">iPhone 15 Pro Max</option>
          <option value="iphone-14">iPhone 14</option>
          <option value="iphone-se">iPhone SE</option>
          <option value="ipad-pro-11">iPad Pro 11"</option>
          <option value="ipad-mini">iPad Mini</option>
        </optgroup>
        <optgroup label="Samsung">
          <option value="galaxy-s24-ultra">Galaxy S24 Ultra</option>
          <option value="galaxy-s24">Galaxy S24</option>
          <option value="galaxy-z-fold5">Galaxy Z Fold5</option>
          <option value="galaxy-tab-s9">Galaxy Tab S9</option>
        </optgroup>
        <optgroup label="Google">
          <option value="pixel-8-pro">Pixel 8 Pro</option>
          <option value="pixel-8">Pixel 8</option>
          <option value="pixel-7a">Pixel 7a</option>
        </optgroup>
        <optgroup label="Other">
          <option value="custom">Custom Size…</option>
        </optgroup>
      </select>
    </section>

    <!-- Dimensions Display -->
    <section class="card dimensions-card">
      <div class="dimensions-grid">
        <div class="dimension-item">
          <span class="dimension-label">Width</span>
          <input type="number" id="widthInput" class="dimension-value" min="200" max="2048" readonly>
          <span class="dimension-unit">px</span>
        </div>
        <div class="dimension-separator">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </div>
        <div class="dimension-item">
          <span class="dimension-label">Height</span>
          <input type="number" id="heightInput" class="dimension-value" min="200" max="2048" readonly>
          <span class="dimension-unit">px</span>
        </div>
      </div>
      <div class="device-info" id="deviceInfo">
        <span class="device-ratio" id="deviceRatio">19.5:9</span>
        <span class="device-dpr" id="deviceDPR">3x</span>
      </div>
    </section>

    <!-- Simulation Settings -->
    <section class="card">
      <label class="card-label">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="label-icon">
          <circle cx="12" cy="12" r="3"/>
          <path d="m19.4 15 1.2 2.1a1.8 1.8 0 0 1-.7 2.4l-2 1.2a1.8 1.8 0 0 1-2.4-.7L14.3 18h-4.6l-1.2 2a1.8 1.8 0 0 1-2.4.7l-2-1.2a1.8 1.8 0 0 1-.7-2.4L4.6 15"/>
        </svg>
        Settings
      </label>

      <div class="toggle-group">
        <div class="toggle-row">
          <div class="toggle-info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="toggle-icon">
              <path d="M7.5 3.5h9a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-13a2 2 0 0 1 2-2Z"/>
              <path d="M16.5 3.5 7.5 20.5M7.5 3.5l9 17"/>
            </svg>
            <span>Rotate Device</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="rotateToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="toggle-row">
          <div class="toggle-info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="toggle-icon">
              <rect x="6" y="3" width="12" height="18" rx="2"/>
              <line x1="12" y1="18" x2="12" y2="18" stroke-linecap="round" stroke-width="2"/>
            </svg>
            <span>Show Device Frame</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="frameToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="toggle-row">
          <div class="toggle-info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="toggle-icon">
              <circle cx="12" cy="8" r="3"/>
              <path d="M12 11v5"/>
              <circle cx="12" cy="18" r="1"/>
            </svg>
            <span>Touch Simulation</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="touchToggle" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="toggle-row">
          <div class="toggle-info">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" class="toggle-icon">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
              <line x1="3" y1="9" x2="21" y2="9"/>
              <line x1="9" y1="21" x2="9" y2="9"/>
            </svg>
            <span>Override User-Agent</span>
          </div>
          <label class="toggle">
            <input type="checkbox" id="uaToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>
    </section>

    <!-- Action Buttons -->
    <div class="actions">
      <button id="applyBtn" class="btn btn-primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        Apply to Current Tab
      </button>
      <button id="resetBtn" class="btn btn-secondary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="1 4 1 10 7 10"/>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
        </svg>
        Reset
      </button>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>v1.0.0</span>
      <span>·</span>
      <span>Mobile Simulator</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
